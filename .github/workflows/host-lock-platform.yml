name: Host root lock platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: host-lock-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-lock-platform:
    name: Default Host root lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Verify default Host root lock across platforms
        run: node --experimental-strip-types --test packages/coding-agent/test/host-lock-platform.mjs
